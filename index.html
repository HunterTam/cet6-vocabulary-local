<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="六级词汇、阅读积累、听力复盘与记忆曲线，支持 iPhone 添加到主屏幕及云端同步。" />
    <meta name="theme-color" content="#f7f6fd" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="六级复盘" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <title>六级单词复盘</title>
  </head>
  <body style="margin:0;background:#f7f6fd;">
    <div id="root">
      <style>
        .cet6-splash{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(circle at 12% 14%,rgba(233,213,255,.8),transparent 42%),radial-gradient(circle at 88% 18%,rgba(209,250,229,.78),transparent 40%),radial-gradient(circle at 50% 85%,rgba(255,237,213,.72),transparent 45%),#f7f6fd;color:#1e1b2e;text-align:center}
        .cet6-splash-orb{position:relative;width:78px;height:78px;border-radius:25px;background:linear-gradient(140deg,#a78bfa 0%,#7c5dfa 55%,#5b3df5 100%);display:grid;place-items:center;box-shadow:0 18px 36px rgba(124,93,250,.32),inset 0 1px 1px rgba(255,255,255,.5);animation:cet6-bob 1.8s ease-in-out infinite}
        .cet6-splash-orb::after{content:"";position:absolute;inset:-8px;border-radius:30px;border:2px solid rgba(124,93,250,.22);animation:cet6-ring 1.8s ease-out infinite}
        .cet6-splash h1{margin:4px 0 0;font-size:21px;font-weight:800;letter-spacing:-.01em}
        .cet6-splash p{margin:-6px 0 2px;font-size:13px;color:#6e6a86}
        .cet6-splash-bar{width:min(230px,70vw);height:8px;border-radius:999px;background:rgba(124,93,250,.13);overflow:hidden;position:relative;box-shadow:inset 0 1px 2px rgba(96,84,154,.1)}
        .cet6-splash-fill{position:relative;display:block;height:100%;width:86%;border-radius:999px;background:linear-gradient(90deg,#a78bfa 0%,#7c5dfa 50%,#20a472 100%);transform-origin:left center;animation:cet6-grow 2.4s cubic-bezier(.16,1,.3,1) forwards}
        .cet6-splash-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:cet6-shimmer 1.15s ease-in-out infinite}
        .cet6-splash-tip{font-size:11.5px;color:#8a84a3;opacity:.9}
        @keyframes cet6-bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.03)}}
        @keyframes cet6-ring{0%{transform:scale(.9);opacity:.85}100%{transform:scale(1.22);opacity:0}}
        @keyframes cet6-grow{0%{transform:scaleX(.1)}35%{transform:scaleX(.58)}70%{transform:scaleX(.84)}100%{transform:scaleX(.96)}}
        @keyframes cet6-shimmer{0%{transform:translateX(-110%)}100%{transform:translateX(140%)}}
        @media (prefers-reduced-motion:reduce){.cet6-splash-orb,.cet6-splash-orb::after,.cet6-splash-fill,.cet6-splash-fill::after{animation:none}}
      </style>
      <div class="cet6-splash" role="status" aria-label="正在加载六级单词复盘">
        <div class="cet6-splash-orb" aria-hidden="true">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <h1>六级单词复盘</h1>
        <p>正在装载 460+ 词库与艾宾浩斯曲线…</p>
        <div class="cet6-splash-bar"><i class="cet6-splash-fill"></i></div>
        <span class="cet6-splash-tip">首次打开后将自动离线缓存，下次秒开</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
